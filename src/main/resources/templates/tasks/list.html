<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Мои задачи')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container">
    <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
            <h1>Мои задачи</h1>
            <a th:href="@{/tasks/new}" class="btn btn-primary">+ Новая задача</a>
        </div>
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>
        <p th:if="${#lists.isEmpty(tasks)}" class="meta">Задач пока нет. Создайте первую!</p>
        <table th:if="${!#lists.isEmpty(tasks)}" class="task-table">
            <thead>
            <tr>
                <th>Название</th>
                <th>Статус</th>
                <th>Приоритет</th>
                <th>Срок</th>
                <th>Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="task : ${tasks}">
                <td>
                    <a th:href="@{/tasks/{id}(id=${task.id})}" th:text="${task.title}">title</a>
                </td>
                <td><span class="badge" th:classappend="' badge-' + ${task.status}" th:text="${task.status}">NEW</span></td>
                <td><span class="badge" th:classappend="' badge-' + ${task.priority}" th:text="${task.priority}">MEDIUM</span></td>
                <td th:text="${task.deadline != null ? #temporals.format(task.deadline, 'dd.MM.yyyy') : '—'}">—</td>
                <td class="actions">
                    <form th:action="@{/tasks/{id}/status(id=${task.id})}" method="post" class="inline-form">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <select name="status" onchange="this.form.submit()">
                            <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"
                                    th:selected="${s == task.status}"></option>
                        </select>
                    </form>
                    <a th:href="@{/tasks/{id}/edit(id=${task.id})}" class="btn btn-secondary">Изменить</a>
                    <form th:action="@{/tasks/{id}/delete(id=${task.id})}" method="post" class="inline-form"
                          onsubmit="return confirm('Удалить задачу?');">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-danger">Удалить</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
