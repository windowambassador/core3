<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container">
    <div class="card">
        <h1 th:text="${pageTitle}">Задача</h1>
        <form th:action="${taskForm.id != null ? '/tasks/' + taskForm.id : '/tasks'}"
              th:object="${taskForm}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-error">
                <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
            </div>
            <div class="form-group">
                <label for="title">Название *</label>
                <input type="text" id="title" th:field="*{title}"/>
                <p class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></p>
            </div>
            <div class="form-group">
                <label for="description">Описание</label>
                <textarea id="description" th:field="*{description}"></textarea>
                <p class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></p>
            </div>
            <div class="form-group">
                <label for="status">Статус</label>
                <select id="status" th:field="*{status}">
                    <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
                </select>
            </div>
            <div class="form-group">
                <label for="priority">Приоритет</label>
                <select id="priority" th:field="*{priority}">
                    <option th:each="p : ${priorities}" th:value="${p}" th:text="${p}"></option>
                </select>
            </div>
            <div class="form-group">
                <label for="deadline">Срок выполнения</label>
                <input type="date" id="deadline" th:field="*{deadline}"/>
                <p class="field-error" th:if="${#fields.hasErrors('deadline')}" th:errors="*{deadline}"></p>
            </div>
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <a th:href="@{/tasks}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
