<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Вход')}"></head>
<body>
<div class="container">
    <div class="card auth-card">
        <h1>Вход</h1>
        <div th:if="${param.error}" class="alert alert-error">Неверное имя пользователя или пароль</div>
        <div th:if="${param.logout}" class="alert alert-success">Вы вышли из системы</div>
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <form th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="form-group">
                <label for="username">Имя пользователя</label>
                <input type="text" id="username" name="username" required autofocus/>
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" required/>
            </div>
            <button type="submit" class="btn btn-primary">Войти</button>
        </form>
        <p class="meta" style="margin-top: 1rem;">
            Нет аккаунта? <a th:href="@{/register}">Зарегистрироваться</a>
        </p>
    </div>
</div>
</body>
</html>
